<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 12px;
            font-size: 1.8rem;
            font-weight: 700;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .btn-entrar {
            display: inline-block;
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-entrar:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4);
        }

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">📋</div>
        <h1>Bienvenido al Sistema de Asistencia</h1>
        <p>Plataforma para la gestión y control de asistencia de profesores y estudiantes.</p>
        
        <a href="https://github.com/moonsiwu/AsistenciaProfesorApp/tree/main/src/main/java/com/institucion/asistencia" class="btn-entrar">
            Entrar al Proyecto (Main / App)
        </a>

        <footer>
            AsistenciaProfesorApp &bull; 2026
        </footer>
    </div>

</body>
</html>
