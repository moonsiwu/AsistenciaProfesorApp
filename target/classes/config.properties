# Datos de conexi\u00c3\u00b3n a la base de datos MySQL
# Reemplaza db.usuario y db.contrasena con TUS datos reales de MySQL Workbench.
# Si tu MySQL usa un puerto distinto a 3306, c\u00c3\u00a1mbialo tambi\u00c3\u00a9n en db.url.

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/asistencia_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.usuario=root
db.contrasena=123456
